backend:
  name: github
  repo: dimas1221/compro-transforme-v2
  branch: main
  auth_type: oauth
  base_url: https://decap-oauth.vercel.app
  auth_endpoint: auth
  client_id: Ov23liITg4x7Eiae4s6x
publish_mode: editorial_workflow
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  # ==========================================================
  # 1️⃣ FEATURES (features.json)
  # ==========================================================
  - name: "features"
    label: "Features"
    format: "json"
    extension: "json"
    editor:
      preview: false
    files:
      - file: "public/data/features.json"
        label: "Features Data"
        name: "features_data"
        fields:
          - label: "Features"
            name: "features"
            widget: "list"
            summary: "{{fields.title_en}}"
            fields:
              - { label: "ID", name: "id", widget: "number" }
              - { label: "Title (EN)", name: "title_en", widget: "string" }
              - { label: "Title (ID)", name: "title_id", widget: "string" }
              - { label: "Description (EN)", name: "desc_en", widget: "text" }
              - { label: "Description (ID)", name: "desc_id", widget: "text" }
              - { label: "Icon", name: "icon", widget: "string" }
              - { label: "Image", name: "img", widget: "image" }
              - {
                  label: "Learn More Title (EN)",
                  name: "learn_more_title_en",
                  widget: "string",
                }
              - {
                  label: "Learn More Title (ID)",
                  name: "learn_more_title_id",
                  widget: "string",
                }
              - {
                  label: "Learn More Description (EN)",
                  name: "learn_more_desc_en",
                  widget: "text",
                }
              - {
                  label: "Learn More Description (ID)",
                  name: "learn_more_desc_id",
                  widget: "text",
                }
              - {
                  label: "Learn More Image",
                  name: "learn_more_image",
                  widget: "image",
                }

              - label: "Header Learn More"
                name: "header_learn_more"
                widget: "list"
                fields:
                  - { label: "Image", name: "image", widget: "image" }
                  - { label: "Title (EN)", name: "title_en", widget: "string" }
                  - { label: "Title (ID)", name: "title_id", widget: "string" }
                  - {
                      label: "Description (EN)",
                      name: "desc_en",
                      widget: "text",
                    }
                  - {
                      label: "Description (ID)",
                      name: "desc_id",
                      widget: "text",
                    }

              - label: "Benefits"
                name: "benefits"
                widget: "list"
                required: false
                fields:
                  - { label: "Title (EN)", name: "title_en", widget: "string" }
                  - { label: "Title (ID)", name: "title_id", widget: "string" }
                  - {
                      label: "Description (EN)",
                      name: "desc_en",
                      widget: "text",
                    }
                  - {
                      label: "Description (ID)",
                      name: "desc_id",
                      widget: "text",
                    }

              - label: "Tech Stack"
                name: "tech_stack"
                widget: "list"
                required: false
                field: { label: "Technology", name: "tech", widget: "string" }

              - label: "Portfolio Learn More"
                name: "portofolio_learn_more"
                widget: "list"
                required: false
                fields:
                  - { label: "Image", name: "image", widget: "image" }
                  - { label: "Title (EN)", name: "title_en", widget: "string" }
                  - { label: "Title (ID)", name: "title_id", widget: "string" }
                  - {
                      label: "Description (EN)",
                      name: "desc_en",
                      widget: "text",
                    }
                  - {
                      label: "Description (ID)",
                      name: "desc_id",
                      widget: "text",
                    }

              - label: "Team Learn More"
                name: "team_learn_more"
                widget: "list"
                required: false
                fields:
                  - { label: "Image", name: "image", widget: "image" }
                  - { label: "Name", name: "name", widget: "string" }
                  - {
                      label: "Message (EN)",
                      name: "message_en",
                      widget: "text",
                    }
                  - {
                      label: "Message (ID)",
                      name: "message_id",
                      widget: "text",
                    }

  # ==========================================================
  # 2️⃣ PORTFOLIO (portfolio.json)
  # Structure: { portfolios: [{ id, image, title:{id,en}, description:{id,en}, features:{id:[],en:[]} }] }
  # ==========================================================
  - name: "portfolio"
    label: "Portfolio"
    format: "json"
    extension: "json"
    editor:
      preview: false
    files:
      - file: "public/data/portfolio.json"
        label: "Portfolio Data"
        name: "portfolio_json"
        fields:
          - label: "Portfolio Items"
            name: "portfolios"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Image", name: "image", widget: "image" }
              - label: "Title"
                name: "title"
                widget: "object"
                fields:
                  - { label: "Bahasa Indonesia", name: "id", widget: "string" }
                  - { label: "English", name: "en", widget: "string" }
              - label: "Description"
                name: "description"
                widget: "object"
                fields:
                  - { label: "Bahasa Indonesia", name: "id", widget: "text" }
                  - { label: "English", name: "en", widget: "text" }
              - label: "Features"
                name: "features"
                widget: "object"
                fields:
                  - label: "Bahasa Indonesia"
                    name: "id"
                    widget: "list"
                    field: { label: "Feature", name: "item", widget: "string" }
                  - label: "English"
                    name: "en"
                    widget: "list"
                    field: { label: "Feature", name: "item", widget: "string" }

  # ==========================================================
  # 3️⃣ COMPANY CONTENT (companyContent.json)
  # ==========================================================
  - name: "company_content"
    label: "Company Content"
    format: "json"
    extension: "json"
    editor:
      preview: false
    files:
      - file: "public/data/companyContent.json"
        label: "Company Content Data"
        name: "company_content_json"
        fields:
          - label: "About"
            name: "about"
            widget: "object"
            fields:
              - label: "Bahasa Indonesia"
                name: "id"
                widget: "object"
                fields:
                  - { label: "Subtitle", name: "subtitle", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - {
                      label: "Description",
                      name: "description",
                      widget: "text",
                    }
              - label: "English"
                name: "en"
                widget: "object"
                fields:
                  - { label: "Subtitle", name: "subtitle", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - {
                      label: "Description",
                      name: "description",
                      widget: "text",
                    }
          - label: "Vision"
            name: "vision"
            widget: "object"
            fields:
              - label: "Bahasa Indonesia"
                name: "id"
                widget: "object"
                fields:
                  - { label: "Subtitle", name: "subtitle", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Quote", name: "quote", widget: "text" }
              - label: "English"
                name: "en"
                widget: "object"
                fields:
                  - { label: "Subtitle", name: "subtitle", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Quote", name: "quote", widget: "text" }

  # ==========================================================
  # 4️⃣ PRODUCT CATEGORIES (productData.json)
  # ==========================================================
  - name: "product_categories"
    label: "Product Categories"
    format: "json"
    extension: "json"
    editor:
      preview: false
    files:
      - file: "public/data/productData.json"
        label: "Product Categories Data"
        name: "product_categories_json"
        fields:
          - label: "Categories"
            name: "categories"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Key", name: "key", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - label: "Tabs"
                name: "tabs"
                widget: "list"
                field: { label: "Tab Name", name: "tab", widget: "string" }
              - label: "Products"
                name: "items"
                widget: "list"
                summary: "{{fields.slug}} ({{fields.tab}})"
                fields:
                  - { label: "Slug", name: "slug", widget: "string" }
                  - {
                      label: "Tab",
                      name: "tab",
                      widget: "string",
                      hint: "Must match one of the tab names above",
                    }
                  - label: "Title"
                    name: "title"
                    widget: "object"
                    fields:
                      - {
                          label: "Bahasa Indonesia",
                          name: "id",
                          widget: "string",
                        }
                      - { label: "English", name: "en", widget: "string" }
                  - label: "Short Description"
                    name: "description"
                    widget: "object"
                    fields:
                      - {
                          label: "Bahasa Indonesia",
                          name: "id",
                          widget: "text",
                        }
                      - { label: "English", name: "en", widget: "text" }
                  - label: "Long Description"
                    name: "description_long"
                    widget: "object"
                    required: false
                    fields:
                      - {
                          label: "Bahasa Indonesia",
                          name: "id",
                          widget: "text",
                        }
                      - { label: "English", name: "en", widget: "text" }
                  - { label: "Image", name: "image", widget: "image" }
                  - label: "Detail"
                    name: "detail"
                    widget: "object"
                    required: false
                    fields:
                      - label: "Features"
                        name: "features"
                        widget: "object"
                        fields:
                          - label: "Bahasa Indonesia"
                            name: "id"
                            widget: "list"
                            field:
                              {
                                label: "Feature",
                                name: "item",
                                widget: "string",
                              }
                          - label: "English"
                            name: "en"
                            widget: "list"
                            field:
                              {
                                label: "Feature",
                                name: "item",
                                widget: "string",
                              }

  # ==========================================================
  # 5️⃣ PRINCIPALS (principals.json)
  # ==========================================================
  - name: "principals"
    label: "Our Principals"
    format: "json"
    extension: "json"
    editor:
      preview: false
    files:
      - file: "public/data/principals.json"
        label: "Principals Data"
        name: "principals_json"
        fields:
          - label: "Section"
            name: "section"
            widget: "object"
            fields:
              - label: "Subtitle (ID)"
                name: "subtitle"
                widget: "object"
                fields:
                  - { label: "ID", name: "id", widget: "string" }
                  - { label: "EN", name: "en", widget: "string" }
              - label: "Title"
                name: "title"
                widget: "object"
                fields:
                  - { label: "ID", name: "id", widget: "string" }
                  - { label: "EN", name: "en", widget: "string" }
              - label: "Description"
                name: "description"
                widget: "object"
                fields:
                  - { label: "ID", name: "id", widget: "text" }
                  - { label: "EN", name: "en", widget: "text" }
          - label: "Principals"
            name: "principals"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - label: "Tagline"
                name: "tagline"
                widget: "object"
                fields:
                  - { label: "ID", name: "id", widget: "string" }
                  - { label: "EN", name: "en", widget: "string" }
              - label: "Description"
                name: "description"
                widget: "object"
                fields:
                  - { label: "ID", name: "id", widget: "text" }
                  - { label: "EN", name: "en", widget: "text" }
              - label: "About"
                name: "about"
                widget: "object"
                fields:
                  - label: "Title"
                    name: "title"
                    widget: "object"
                    fields:
                      - { label: "ID", name: "id", widget: "string" }
                      - { label: "EN", name: "en", widget: "string" }
                  - label: "Text"
                    name: "text"
                    widget: "object"
                    fields:
                      - { label: "ID", name: "id", widget: "text" }
                      - { label: "EN", name: "en", widget: "text" }
              - label: "Stats"
                name: "stats"
                widget: "list"
                required: false
                summary: "{{fields.value}}"
                fields:
                  - {
                      label: "Value",
                      name: "value",
                      widget: "string",
                      hint: "e.g. 400+, ≥10%",
                    }
                  - label: "Label"
                    name: "label"
                    widget: "object"
                    fields:
                      - { label: "ID", name: "id", widget: "string" }
                      - { label: "EN", name: "en", widget: "string" }
              - label: "Features / Technologies"
                name: "features"
                widget: "list"
                required: false
                summary: "{{fields.title}}"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - label: "Description"
                    name: "description"
                    widget: "object"
                    fields:
                      - { label: "ID", name: "id", widget: "text" }
                      - { label: "EN", name: "en", widget: "text" }
                  - {
                      label: "Image",
                      name: "image",
                      widget: "image",
                      required: false,
                    }
              - label: "Highlights"
                name: "highlights"
                widget: "object"
                fields:
                  - label: "ID"
                    name: "id"
                    widget: "list"
                    field: { label: "Item", name: "item", widget: "string" }
                  - label: "EN"
                    name: "en"
                    widget: "list"
                    field: { label: "Item", name: "item", widget: "string" }
              - { label: "Banner Image", name: "image", widget: "image" }
              - { label: "Logo", name: "logo", widget: "image" }
              - {
                  label: "Color (hex)",
                  name: "color",
                  widget: "string",
                  hint: "e.g. #0EA5E9",
                }

  # ==========================================================
  # 6️⃣ PARTNERS (partners.json)
  # ==========================================================
  - name: "partners"
    label: "Partners"
    format: "json"
    extension: "json"
    editor:
      preview: false
    files:
      - file: "public/data/partners.json"
        label: "Partners Data"
        name: "partners_json"
        fields:
          - label: "Partners"
            name: "partners"
            widget: "list"
            summary: "{{fields.title}} — {{fields.full}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Full Name", name: "full", widget: "string" }
              - { label: "Logo", name: "logo", widget: "image" }
              - {
                  label: "Color",
                  name: "color",
                  widget: "string",
                  hint: "Hex color code, e.g. #2563EB",
                }
              - {
                  label: "Use Initials",
                  name: "useInitials",
                  widget: "boolean",
                  default: false,
                  hint: "Show initials instead of logo image",
                }

  # ==========================================================
  # 7️⃣ TEAM (team.json)
  # ==========================================================
  - name: "team"
    label: "Our Team"
    format: "json"
    extension: "json"
    editor:
      preview: false
    files:
      - file: "public/data/team.json"
        label: "Team Data"
        name: "team_json"
        fields:
          - label: "Section"
            name: "section"
            widget: "object"
            fields:
              - label: "Subtitle"
                name: "subtitle"
                widget: "object"
                fields:
                  - { label: "Bahasa Indonesia", name: "id", widget: "string" }
                  - { label: "English", name: "en", widget: "string" }
              - label: "Title"
                name: "title"
                widget: "object"
                fields:
                  - { label: "Bahasa Indonesia", name: "id", widget: "string" }
                  - { label: "English", name: "en", widget: "string" }
              - label: "Description"
                name: "description"
                widget: "object"
                fields:
                  - { label: "Bahasa Indonesia", name: "id", widget: "text" }
                  - { label: "English", name: "en", widget: "text" }
          - label: "Members"
            name: "members"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - label: "Role"
                name: "role"
                widget: "object"
                fields:
                  - { label: "Bahasa Indonesia", name: "id", widget: "string" }
                  - { label: "English", name: "en", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image" }
